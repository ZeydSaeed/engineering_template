; PHP-FPM pool for one application (ADR-0021). Its own Linux user, socket
; and limits, so applications on one server stay apart. Size pm.max_children
; with docs/operations/capacity.md, never by guessing.

[APP]
user = APP
group = APP
listen = /run/php/APP.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; static for a busy main application; ondemand for a small one sharing the
; server (workers start on demand and stop when idle).
pm = static
pm.max_children = 16
pm.max_requests = 1000
; ondemand: pm.process_idle_timeout = 30s

; Above max_execution_time (60 s), below Nginx fastcgi_read_timeout (90 s).
request_terminate_timeout = 75s

; Requests slower than this leave a stack trace in the slow log.
request_slowlog_timeout = 5s
slowlog = /srv/APP/shared/storage/logs/php-fpm-slow.log

; Status for local monitoring only (the exporter reads it over the socket).
pm.status_path = /fpm-status
ping.path = /fpm-ping

catch_workers_output = yes
php_admin_value[error_log] = /srv/APP/shared/storage/logs/php-fpm.log
php_admin_flag[log_errors] = on

; The application reads only its own release and shared directories.
php_admin_value[open_basedir] = /srv/APP/:/tmp/:/usr/share/php/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
