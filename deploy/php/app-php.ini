; PHP settings for one application's FPM pool (ADR-0021). Included from the
; pool or the FPM conf.d; the CLI keeps its own limits for queue workers.

expose_php = Off
memory_limit = 256M

; Web requests: under request_terminate_timeout (75 s).
max_execution_time = 60
max_input_time = 30

; Uploads: platform.files.max_kb (10 MB) fits in upload_max_filesize, which
; fits in post_max_size, which fits in Nginx client_max_body_size (12 MB).
upload_max_filesize = 10M
post_max_size = 11M
max_file_uploads = 10

; Sessions are Laravel's; PHP's own session handling is unused.
session.use_strict_mode = 1

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Releases switch a symlink and reload FPM; files never change in place.
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
