# Nginx site for one application (ADR-0021). Replace APP and HOST; the
# certificate is a Cloudflare Origin Certificate (SSL mode Full (strict)) or
# any other. tests/Feature/Platform/DeployTemplatesTest.php checks the
# timeout and size chains below against the PHP templates.

# Timeouts, outermost first: edge (Cloudflare 100 s) > fastcgi_read_timeout
# (90 s) > PHP-FPM request_terminate_timeout (75 s) > PHP max_execution_time
# (60 s) > outbound HTTP calls. Each layer gives up before the one above it.

limit_req_zone $binary_remote_addr zone=APP_requests:10m rate=20r/s;

# Unknown host names: dropped, on both ports.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name HOST;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name HOST;

    ssl_certificate /etc/ssl/APP/origin.pem;
    ssl_certificate_key /etc/ssl/APP/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:APP:10m;
    ssl_session_timeout 1d;

    root /srv/APP/current/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Uploads: platform.files.max_kb (10 MB) plus form overhead.
    client_max_body_size 12m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    # Preload Link headers and session cookies outgrow the default buffers.
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Probes and metrics for this machine only (deploy checks, Prometheus).
    # The application checks /metrics again (address or bearer token).
    location ~ ^/(up|health/ready|metrics)$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/APP.sock;
    }

    # Built assets carry content hashes: cached for a year. Served without
    # PHP, so the headers PHP sets elsewhere are set here.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        limit_req zone=APP_requests burst=40 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel's front controller is the only PHP that runs.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/APP.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 90s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
