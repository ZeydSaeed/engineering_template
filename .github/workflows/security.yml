name: security

# Secrets, static analysis, dependency advisories and a passive web scan
# (Phase 8, ADR-0030, docs/standards/ci.md). Weekly as well, because new
# advisories appear without any change here.

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Every commit, not only the last: the repository is public.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks (checksum verified)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --verbose .

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep
        run: |
          python3 -m venv /tmp/semgrep
          /tmp/semgrep/bin/pip install --quiet semgrep==1.182.1
          /tmp/semgrep/bin/semgrep scan --metrics=off --error \
            --config p/php --config p/typescript --config p/react \
            --config p/javascript --config p/secrets \
            app config routes resources/js bootstrap database

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Composer advisories
        run: composer audit --locked

      - name: npm advisories
        run: npm audit

      # New or changed dependencies in a pull request: known advisories and
      # licences that do not fit a reusable template.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0

  # A passive scan of what a visitor reaches without signing in, served the
  # way a server serves it: the deploy/ templates for Nginx and PHP-FPM,
  # HTTPS, APP_ENV=production (scripts/ci/production-like.sh). Every alert
  # fails the job unless .zap/rules.tsv lists it with a reason.
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Build
        run: |
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build
          rm .env

      - name: Serve like production
        run: bash scripts/ci/production-like.sh

      - name: ZAP baseline
        run: |
          mkdir -p zap && chmod 777 zap
          cp .zap/rules.tsv zap/rules.tsv
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t https://localhost -c rules.tsv -r report.html -J report.json -j

      # Each alert as an annotation on the run, readable without
      # downloading the report.
      - name: Alerts
        if: always()
        run: |
          [ -f zap/report.json ] || exit 0
          python3 - <<'PY'
          import json
          report = json.load(open('zap/report.json'))
          for site in report.get('site', []):
              for alert in site.get('alerts', []):
                  uris = sorted({i.get('uri', '') for i in alert.get('instances', [])})[:3]
                  print(f"::warning title=ZAP {alert.get('pluginid')}::{alert.get('name')} ({alert.get('riskdesc')}) {' '.join(uris)}")
          PY

      - name: Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: |
            zap/report.html
            zap/report.json
          retention-days: 14
